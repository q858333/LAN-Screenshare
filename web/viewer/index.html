<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LAN 屏幕共享 · 网页观看</title>
    <link rel="stylesheet" href="viewer.css" />
  </head>
  <body>
    <main>
      <h1>LAN 屏幕共享 <span class="tag">网页观看</span></h1>
      <p class="hint">
        分享端需运行桌面客户端并<strong>启动分享</strong>。端口必须为 <strong>17891</strong>（不是桌面观看端的 17890）。
      </p>
      <p class="hint cert-hint" id="cert-hint">
        从 GitHub Pages 打开时，须先在<strong>本机浏览器</strong>信任分享端证书：填写 IP 后点
        <button type="button" id="cert-btn" class="linkish">打开 HTTPS 并信任</button>，在出现警告的页面选择继续访问，再回到此处点「连接」。
      </p>
      <div class="connect-row">
        <div class="field">
          <label for="host-input">分享端 IP</label>
          <input id="host-input" type="text" placeholder="例如 192.168.1.12" autocomplete="off" />
        </div>
        <div class="field field-narrow">
          <label for="port-input">端口</label>
          <input id="port-input" type="number" value="17891" min="1" max="65535" />
        </div>
        <button type="button" id="connect-btn">连接</button>
        <button type="button" id="disconnect-btn" class="secondary">断开</button>
      </div>
      <div id="status" class="status">请输入分享端 IP 并点击连接</div>
      <video id="video" autoplay playsinline muted></video>
      <section class="diag-section" aria-label="诊断日志">
        <button type="button" id="diag-toggle" class="secondary diag-toggle" aria-expanded="false">
          诊断日志
        </button>
        <div id="diag-panel" class="diag-panel" hidden>
          <p class="hint diag-hint">信令 / WebRTC / ICE 事件（仅本机浏览器，不上传）。出问题时点「复制」发给维护者。</p>
          <div class="diag-toolbar">
            <button type="button" id="diag-copy" class="secondary">复制</button>
            <button type="button" id="diag-clear" class="secondary">清空</button>
            <label class="diag-follow">
              <input type="checkbox" id="diag-follow" checked />
              自动滚动
            </label>
          </div>
          <pre id="diag-view" class="diag-view"></pre>
        </div>
      </section>
      <p class="foot">仅观看 · 无远程控制 · 系统声音尚未支持</p>
    </main>
    <script src="viewer.js"></script>
  </body>
</html>
